name: data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "fetch.py"
      - ".github/workflows/data.yml"

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch
        env:
          YT_KEY: ${{ secrets.YT_KEY }}
          TWITCH_ID: ${{ secrets.TWITCH_ID }}
          TWITCH_SECRET: ${{ secrets.TWITCH_SECRET }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: python fetch.py

      - name: Commit data
        run: |
          git config user.name "six-stars-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "no data change"
          else
            git commit -m "data: $(date -u +%FT%TZ)"
            git push
          fi
